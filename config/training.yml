  ddp_bucket_cap_mb: 50
  ddp_gradient_as_bucket_view: false
  ddp_static_graph: false
  disjoint_rank_cpu_affinity: true
  distributed_validation: true
  validation_batch_size: 8
  old_p7_checkpoint_resume: prohibited
