supersession:
  training_authority_id: p7a_ee0cafa07978d7d2b168ef27
  acceptance_id: p7acc_d9fa1683bbccd4de7f2636b2
  best_checkpoint_id: p7ck_9e557e1440253ac52fac4197
  latest_checkpoint_id: p7ck_f01b68dde9837780feff5c98
  status: superseded_research_use_blocked
  reason: p6_geometry_layout_2_batch_context_contamination
  resume_allowed: false

population:
  training_scenes: 256
  validation_scenes: 32
  validation_queries: 64
  validation_gallery: 32
  evaluation_scenes_declared_but_prohibited: 32

training:
  root_seed: 20260828
  profile_id: main_1.0x
  logical_k: 8
  views_per_scene: 2
  global_batch_size: 32
  world_size: 2
  per_rank_batch_size: 16
  maximum_epochs: 200
  updates_per_epoch: 8
  maximum_updates: 1600
  modality_mask_probability: 0.30

optimizer:
  name: AdamW
  peak_learning_rate: 0.001
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8
  parameter_grouping: all_trainable_parameters_same_weight_decay
  gradient_clip:
    norm_type: 2.0
    maximum_norm: 1.0

scheduler:
  indexing: one_based_optimizer_update
  warmup_updates: 80
  decay_updates: 1520
  minimum_learning_rate: 0.0
  restart: false
  update_order: set_before_optimizer_update

objective:
  contrastive_temperature: 0.1
  negative_exclusion_distance_m: 750.0
  information_preservation_weight: 1.0
  huber_delta: 1.0
  phase_relative_magnitude_threshold: 0.05
  empty_component_rule: exclude_from_active_modality_average
  directions: [view_0_to_view_1, view_1_to_view_0]

ema:
  coefficient: 0.999
  initialization: exact_online_copy
  update_after_optimizer: true

queue:
  capacity: 8192
  embedding_dimension: 64
  initialization: empty_zero_storage
  gather_order: rank_then_local_sample_then_view
  enqueue_views: [0, 1]

validation:
  interval_epochs: 5
  patience_events: 4
  primary_metric: validation_retrieval_loss
  equivalence_threshold: 0.0001
  secondary_metric: mean_source_separation_margin
  final_tie_break: earlier_epoch
  patience_reset: selected_best_event
  supplementary_metrics: [MRR, HIT@1, HIT@5, HIT@10]
  evaluation_consumption: prohibited

numeric:
  backend: nccl
  precision: float32
  amp: false
  grad_scaler: false
  tf32_matmul: false
  tf32_cudnn: false
  deterministic_algorithms: true
  deterministic_warn_only: false
  cudnn_deterministic: true
  cudnn_benchmark: false
  cublas_workspace_config: ":4096:8"

runtime:
  selected_gpu_indices: [0, 1]
  dataloader_workers_per_rank: 0
  native_threads_per_rank: 1
  gpu_lock_root: /mnt/hdd002/dhnyu/fusedata/runtime/gpu_locks
  gpu_lock_timeout_seconds: 120
  nccl_p2p_disable: true
  nccl_ib_disable: true
  reference_tolerance:
    loss_atol: 1.0e-6
    gradient_atol: 1.0e-6
    gradient_rtol: 1.0e-5
  resume_equivalence_updates: 4
  resume_interrupt_after_updates: 2

execution_contract:
  geometry_layout_version: "3.0.0"
  geometry_cache_schema_version: "3.0.0"
  geometry_cache_memory_limit_gib_per_rank: 4
  packed_evidence_materialization: true
  deterministic_cpu_lookahead_batches: 1
  ddp_find_unused_parameters: false
  ddp_bucket_cap_mb: 50
  ddp_gradient_as_bucket_view: false
  ddp_static_graph: false
  disjoint_rank_cpu_affinity: true
  distributed_validation: true
  validation_batch_size: 8
  old_p7_checkpoint_resume: prohibited
