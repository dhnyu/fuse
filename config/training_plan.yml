schema_version: "1.0.0"
training_plan_contract_version: "3.0.0"

identity:
  accepted_dataset_id: ptd_bcb9e6a1061ff7ca9c716b20
  encoder_acceptance_id: pea_1c66760dbc1e6c0a8d71cb91
  joint_model_acceptance_id: pjm_6e64c022281a7f2648f78917
  distributed_joint_acceptance_id: pjd_69c0bd35dac8add3280d72e2
  augmentation_acceptance_id: paa_5d2b1f56119e8d5f5050a75d
  no_op_gate_id: pgr_77294c825bf26bf6fce721c3
  dataloader_smoke_id: pdl_5eb0ccb9951d1015d6d64649
  dissertation_commit: 87990db83f2b30200cc2d64dc160cb41f691e0e7

runs:
  seeds: [20260822]
  order: ascending_seed
  execution_mode: two_process_ddp
  requested_gpu_count: 2
  precision: float32

data:
  training_scenes: 256
  validation_scenes: 32
  evaluation_scenes: 32
  epoch_order: numpy_pcg64_permutation_keyed_by_seed_and_epoch
  effective_batch_scenes: 32
  accumulation: partition_epoch_into_exact_32_scene_optimizer_groups_then_apply_hard_budget_microbatching
  hard_budgets:
    scenes: 8
    nodes: 14000
    ordered_edges: 140000
    coordinates: 50000
    actual_payload_bytes: 10485760

optimization:
  optimizer: AdamW
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  maximum_epochs: 200
  scheduler: linear_warmup_then_cosine_decay
  warmup_epochs: 10
  schedule_unit: epoch_converted_to_optimizer_steps_from_training_population_and_effective_batch
  optimizer_steps_per_epoch: 8
  optimizer_steps_per_epoch_derivation: training_scenes_divided_by_effective_batch_scenes_exact
  warmup_optimizer_steps_derivation: warmup_epochs_times_optimizer_steps_per_epoch
  cosine_progress: completed_optimizer_steps_minus_warmup_steps_divided_by_maximum_steps_minus_warmup_steps
  scheduler_step_order: optimizer_step_then_scheduler_step
  gradient_norm_clip: 1.0
  ema_momentum: 0.999
  queue_size: 8192
  temperature: 0.1
  geographic_negative_exclusion_radius_m: 750

validation:
  interval_epochs: 5
  checkpoint_interval_epochs: 5
  early_stopping_patience_evaluations: 10
  primary_metric: MRR
  supplementary_metrics: [HIT@1, HIT@5, HIT@10]
  checkpoint_selection: highest_MRR_then_lowest_validation_retrieval_loss_then_highest_mean_positive_hardest_negative_margin_then_earliest_epoch
  evaluation_split_for_selection: validation_only
  query_views: 2
  query_augmentation_epoch: 0
  candidate_population: unaugmented_validation_scenes
  query_population: two_fixed_augmented_views_of_validation_scenes
  similarity: cosine_online_scene_embedding_before_projection
  fixed_query_views: true
  fixed_query_augmentation_seed: true
  fixed_candidate_gallery: true
  retrieval_loss:
    definition: deterministic_full_gallery_retrieval_cross_entropy
    logits: cosine_similarity_divided_by_temperature
    temperature: 0.1
    reduction: mean_over_two_fixed_query_views_and_validation_scenes
    candidate_exclusion: none
    positive: unique_same_scene_unaugmented_candidate
  retrieval_loss_min_delta: 1.0e-4
  retrieval_loss_min_delta_basis: predefined_before_lr_diagnostic_from_float32_resolution_and_exact_repeatability_gate
  floating_point_tolerance: 1.0e-12
  mrr_saturation_value: 1.0
  patience_reset: higher_MRR_or_saturated_retrieval_loss_min_delta
  ties_do_not_reset_patience: false
  evaluation_and_test_for_selection: forbidden

resume:
  policy: exact_last_checkpoint
  required_state:
    - online_model
    - target_model
    - optimizer
    - scheduler
    - ema
    - queue_values
    - queue_scene_ids
    - queue_scene_centers
    - queue_pointer
    - python_rng
    - numpy_rng
    - torch_cpu_rng
    - torch_cuda_rng
    - sampler_epoch
    - sampler_permutation
    - sampler_position
    - accumulation_scene_count
    - accumulation_gradient_state
    - best_checkpoint_metric_state
    - validation_history
    - early_stopping_patience_state
    - early_stopping_metric_state
  checkpoint_boundary: complete_logical_optimizer_group_only
  atomic_publication: true
  same_id_different_content: hard_failure

execution:
  process_workers: 40
  dataloader_workers: 40
  distributed_strategy: pytorch_distributed_data_parallel
  distributed_backend: nccl
  world_size: 2
  workers_per_rank: 20
  rank_logical_batch_scenes: 16
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 4
  native_threads_per_worker: 1
  process_start_method: spawn
  worker_count_scientific_identity: excluded

resource_estimate:
  maximum_optimizer_steps: 1600
  maximum_microbatches: 7800
  checkpoint_count_range: [11, 40]
  wall_time_method: I18_elapsed_per_representative_batch_times_I17_maximum_microbatches
  checkpoint_bytes_method: float32_joint_online_target_encoder_adam_moments_queue_and_1MiB_control_state

output:
  root: /mnt/hdd002/dhnyu/fusedata/training_data/v1/prototype/plans/prototype_train
  spec_name: run-spec.json
  manifest_name: prototype_training_plan_manifest.json
  qc_name: prototype_training_plan_qc.json
