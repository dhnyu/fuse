schema_version: "1.0.0"
serialization_shard_contract_version: "1.3.0"

identity:
  spatial_dataset_id: psa_495cd109e72ec45bf2b8e7fa
  serialization_plan_id: psp_e82f7a94708626c722544505
  serialization_dataset_id: psd_e82f7a94708626c722544505

serialization:
  algorithm: accepted_source_to_scene_ragged_tensor_v1
  entity_order: scene_id_then_local_entity_id
  edge_order: source_local_entity_id_then_destination_local_entity_id_then_relation_mask
  safetensors_version: "0.8.0"
  compression: none

geometry_representations:
  model:
    relative_position: {dtype: float32, unit: meter}
    intrinsic_coordinates: {dtype: float32, unit: scene_width_fraction, scale_to_m: 500.0}
    purpose: encoder_input
  scientific_reference:
    crs: EPSG:5186
    absolute_coordinates: {dtype: float64, authoritative: true}
    accepted_center: {dtype: float64, validation_only: true}
    building_observed_area_m2_reference:
      dtype: float64
      unit: square_meter
      crs: EPSG:5186
      scope: building_entities_only
      source_stage: I10_vector_observation
      source_column: observed_area_m2
      forwarding: I13_accepted_dictionary_to_I14_verified_vector_manifest
      extraction_algorithm: verified_building_observed_parquet_local_entity_join
      authoritative_for: [original_selected_host_ordering, original_model_standardization, augmentation_start_value]
      geometry_area_role: cross_runtime_qc_and_accepted_augmented_geometry_only
      encoder_input: forbidden
    purpose: [exact_geometry_reconstruction, augmentation, no_op_round_trip, geometry_derived_attributes, spatial_relations, source_to_model_numerical_round_trip]
    inverse_reconstruction_from_model_float32: forbidden
    relation_predicate_input: float64_absolute_geometry_only
    model_conversion: after_scientific_qc_only
    encoder_input: forbidden

tensor:
  float_tolerance: 1.0e-5
  geometry_normalization_length_m: 500.0
  entity_type_codes: {B: 0, R: 1, P: 2}
  geometry_type_codes: {POINT: 0, MULTIPOINT: 1, LINESTRING: 2, MULTILINESTRING: 3, POLYGON: 4, MULTIPOLYGON: 5}
  geometry_available: {B: true, R: true, P: false}
  object_raster_features:
    - lc_fraction_01
    - lc_fraction_02
    - lc_fraction_03
    - lc_fraction_04
    - lc_fraction_05
    - lc_fraction_06
    - lc_fraction_07
    - lc_fraction_08
    - lc_fraction_09
    - lc_fraction_10
    - lc_fraction_11
    - lc_fraction_12
    - lc_fraction_13
    - lc_fraction_14
    - lc_fraction_15
    - lc_fraction_16
    - lc_fraction_17
    - lc_fraction_18
    - lc_fraction_19
    - lc_fraction_20
    - lc_fraction_21
    - lc_fraction_22
    - lc_valid_support_ratio
    - object_dem_mean_standardized
    - object_dem_sd_standardized
    - dem_valid_support_ratio
  categorical_attributes:
    B: [A9, A11]
    R: [ROAD_RANK, ROAD_TYPE]
    P: [CLASS_L1, CLASS_L2, CLASS_L3, CLASS_L4, CLASS_L5, CLASS_L6]
  numerical_attributes:
    B: [building_observed_area_m2, building_observed_gross_floor_area_m2]
    R: [road_lanes]
  safetensors:
    entities:
      local_entity_id: {dtype: int64, shape: ["N"]}
      entity_type: {dtype: uint8, shape: ["N"]}
      relative_position_m: {dtype: float32, shape: ["N", 2]}
      object_raster: {dtype: float32, shape: ["N", 26]}
      object_dem_missing: {dtype: uint8, shape: ["N", 2]}
      building_row_index: {dtype: int64, shape: [NB]}
      building_category: {dtype: int32, shape: [NB, 2]}
      building_numerical: {dtype: float32, shape: [NB, 2]}
      building_missing: {dtype: uint8, shape: [NB, 2]}
      road_row_index: {dtype: int64, shape: [NR]}
      road_category: {dtype: int32, shape: [NR, 2]}
      road_numerical: {dtype: float32, shape: [NR, 1]}
      road_missing: {dtype: uint8, shape: [NR, 1]}
      poi_row_index: {dtype: int64, shape: [NP]}
      poi_category: {dtype: int32, shape: [NP, 6]}
    geometry:
      coordinates_xy: {dtype: float32, shape: [C, 2]}
      coordinates_absolute_xy_5186: {dtype: float64, shape: [C, 2]}
      reference_center_absolute_xy_5186: {dtype: float64, shape: ["N", 2]}
      building_observed_area_m2_reference: {dtype: float64, shape: [NB]}
      geometry_type: {dtype: uint8, shape: ["N"]}
      geometry_available: {dtype: uint8, shape: ["N"]}
      entity_coordinate_offsets: {dtype: int64, shape: [N_plus_1]}
      entity_component_offsets: {dtype: int64, shape: [N_plus_1]}
      component_coordinate_offsets: {dtype: int64, shape: [COMPONENT_plus_1]}
      entity_part_offsets: {dtype: int64, shape: [N_plus_1]}
      part_coordinate_offsets: {dtype: int64, shape: [PART_plus_1]}
      entity_ring_offsets: {dtype: int64, shape: [N_plus_1]}
      ring_component_index: {dtype: int64, shape: [RING]}
      ring_coordinate_start: {dtype: int64, shape: [RING]}
      ring_coordinate_end: {dtype: int64, shape: [RING]}
      ring_is_hole: {dtype: uint8, shape: [RING]}
    edges:
      edge_index: {dtype: int64, shape: [2, E]}
      relation_mask: {dtype: uint8, shape: [E]}
    topology:
      road_endpoint_node_index: {dtype: int64, shape: [NR, 2]}
      road_endpoint_retained: {dtype: uint8, shape: [NR, 2]}
      node_incident_road_count: {dtype: int32, shape: [TN]}
      node_state: {dtype: uint8, shape: [TN]}
      node_xy_5186: {dtype: float64, shape: [TN, 2]}
    rasters:
      landcover_class_fraction: {dtype: float32, shape: [22, 100, 100]}
      landcover_valid_support: {dtype: float32, shape: [100, 100]}
      landcover_valid_mask: {dtype: uint8, shape: [100, 100]}
      dem_standardized_mean: {dtype: float32, shape: [17, 17]}
      dem_valid_support: {dtype: float32, shape: [17, 17]}
      dem_valid_mask: {dtype: uint8, shape: [17, 17]}

archive:
  format: webdataset_tar
  tar_format: ustar
  member_order: [meta.json, entities.safetensors, geometry.safetensors, edges.safetensors, topology.safetensors, rasters.safetensors]
  member_name: "{scene_id}.{member}"
  index_extension: .idx
  metadata: {mtime: 0, uid: 0, gid: 0, uname: "", gname: "", mode: 420}
  canonical_json: sorted_object_keys_compact_utf8_lf
  parquet_compression: zstd
  parquet_row_group_size: 65536

round_trip:
  scope: every_scene
  exact: [integer, id, offset, mask, category, edge_order, raster_shape]
  float: float32_source_cast_tolerance
