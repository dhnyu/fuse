<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retrieval Inspector · Composite C</title><link rel="stylesheet" href="augmentation.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="legacy_bands.css"><link rel="stylesheet" href="bands.css"><link rel="stylesheet" href="locations.css"><link rel="stylesheet" href="prototype.css"></head>
<body data-query="0" data-config-sha="__CONFIG_SHA__"><header><div class="brand"><h1>Spatial Scene Inspector · 9,000 queries × 28 models</h1><span>Composite C · Local validation edition · 28 accepted models · query ordering describes cosine, not correctness</span></div><div class="controls">
<span>All 9,000 evaluation scenes</span>
<label>Model<select id="model"></select></label><label>Mode<select id="mode"><option value="standard">Standard</option><option value="nonlocal">Non-local ≥ 2 km</option></select></label>
<label>Query ordering<select id="order"><option value="original">Original (reset)</option><option value="asc">Rank-1 ↑ · ascending cosine</option><option value="desc">Rank-1 ↓ · descending cosine</option></select></label>
<label>Position <input id="position" type="number" min="1" max="9000" value="1"> / 9000</label><button id="positionGo">Go to position</button><button id="prev">Previous</button><button id="next">Next</button><button id="random">Random</button>
<label>Global index<input id="global" type="number" min="1" max="9000" value="1"></label><button id="globalGo">Go to global index</button>
<label>Scene ID / location<input id="search" type="search" placeholder="Scene ID, 시군구, 행정동"></label><span id="matchCount"></span><details id="searchPanel"><summary>Search results (up to 30)</summary><div id="searchResults"></div></details>
<div class="layer-group"><span>Main-card layers</span><label><input type="checkbox" data-layer="B" checked>Buildings</label><label><input type="checkbox" data-layer="R" checked>Roads</label><label><input type="checkbox" data-layer="P" checked>POIs</label><label><input type="checkbox" data-layer="LC" checked>LC</label><label><input type="checkbox" data-layer="H" checked>Hillshade</label></div><button id="resetZoom">Reset zoom</button>
</div></header><main><div id="error" class="warning" role="alert" hidden></div><div class="case-meta"><h2 id="caseTitle">Loading verified query index…</h2><code id="identity"></code><div id="progress" role="status"></div></div><section id="comparison" class="comparison" aria-live="polite"></section><details><summary>Provenance and interpretation</summary><pre id="provenanceText"></pre></details></main><div id="tooltip" class="tooltip"></div>
<script>window.S10_BANDS=true;</script><script src="app.js"></script><script src="locations.js"></script><script src="helpers.js"></script><script src="runtime.js"></script></body></html>
