  world_size: 2
  per_rank_batch_size: 16
  maximum_epochs: 200
  updates_per_epoch: 76
  maximum_updates: 15200
  modality_mask_probability: 0.30

optimizer:
  name: AdamW
  peak_learning_rate: 0.001
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8
  parameter_grouping: all_trainable_parameters_same_weight_decay
  gradient_clip:
    norm_type: 2.0
    maximum_norm: 1.0

scheduler:
  indexing: one_based_optimizer_update
  warmup_updates: 760
  decay_updates: 14440
  minimum_learning_rate: 0.0
  restart: false
  update_order: set_before_optimizer_update

objective:
  contrastive_temperature: 0.1
  negative_exclusion_distance_m: 750.0
  directions: [view_0_to_view_1, view_1_to_view_0]

ema:
  coefficient: 0.999
  initialization: exact_online_copy
  update_after_optimizer: true

queue:
  capacity: 8192
  embedding_dimension: 128
  initialization: empty_zero_storage
  gather_order: rank_then_local_sample_then_view
  enqueue_views: [0, 1]

validation:
  interval_epochs: 5
  patience_events: 4
  primary_metric: validation_retrieval_loss
  equivalence_threshold: 0.0001
  secondary_metric: mean_source_separation_margin
  final_tie_break: earlier_epoch
  patience_reset: selected_best_event
  supplementary_metrics: [MRR, HIT@1, HIT@5, HIT@10]
  evaluation_consumption: prohibited

numeric:
  backend: nccl
  precision: float32
  amp: false
  grad_scaler: false
  tf32_matmul: false
  tf32_cudnn: false
  deterministic_algorithms: true
  deterministic_warn_only: false
  cudnn_deterministic: true
  cudnn_benchmark: false
  cublas_workspace_config: ":4096:8"

runtime:
  selected_gpu_indices: [0, 1]
  dataloader_workers_per_rank: 0
  native_threads_per_rank: 1
  gpu_lock_root: /mnt/hdd002/dhnyu/fusedata/runtime/gpu_locks
  gpu_lock_timeout_seconds: 120
  nccl_p2p_disable: true
  nccl_ib_disable: true
  reference_tolerance:
    loss_atol: 1.0e-6
    gradient_atol: 1.0e-6
    gradient_rtol: 1.0e-5
  resume_equivalence_updates: 4
  resume_interrupt_after_updates: 2

execution_contract:
  geometry_layout_version: "3.0.0"
  geometry_cache_schema_version: "3.0.0"
  geometry_cache_memory_limit_gib_per_rank: 4
  packed_evidence_materialization: true
