contract_schema_version: "1.0.0"
scene_schema_version: "1.0.0"
prototype_schema_version: "1.0.0"

crs:
  processing_epsg: 5186
  official_grid_epsg: 5179

scene:
  width_m: 500
  training_stride_m: 250
  training_center_predicate: within
  source_buffer_m: 400
  coordinate_precision_m: 0.001

off_lattice:
  validation_count: 1000
  evaluation_count: 2000
  minimum_training_center_distance_m: 50
  sampling_distribution: uniform_within_boundary_bbox_rejection
  rng_kind: Mersenne-Twister
  normal_kind: Inversion
  sample_kind: Rejection
  sampling_seed: 20260821
  partition_seed: 20260822
  batch_size: 10000
  maximum_draws: 100000

retrieval:
  query_count: 10
  query_seed: 20260823
  unrestricted_candidate_count: 1999
  exclude_query_itself_only: true
  include_other_queries: true
  non_local_minimum_distance_m: 2000

ids:
  hash_algorithm: sha256
  scene_prefix: scn_
  footprint_prefix: fpt_
  digest_characters: 24

prototype:
  seed: 20260824
  counts:
    training: 256
    validation: 32
    evaluation: 32
  density_quantiles: [0.20, 0.80, 0.95]
  boundary_proximity_m: 250
  proxy_definition: pre_membership_bbox_index_intersection_counts
