<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Evaluation Scenes · Retrieval Inspector Prototype</title><link rel="stylesheet" href="augmentation.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="legacy_bands.css"><link rel="stylesheet" href="bands.css"><link rel="stylesheet" href="locations.css"><link rel="stylesheet" href="prototype.css"></head>
<body data-query="0" data-config-sha="__CONFIG_SHA__"><header><div class="brand"><h1>Spatial Scene Inspector · 9,000 queries</h1><span>Supplemental local prototype · stored FM evidence · HIGH/LOW describe cosine, not correctness</span></div><div class="controls">
<label>Query source<select id="preset"><option value="ALL">All 9,000 evaluation scenes</option><option value="STANDARD_HIGH_OBJ20">Standard HIGH (obj ≥ 20)</option><option value="STANDARD_LOW">Standard LOW</option><option value="NONLOCAL_HIGH_OBJ20">Non-local HIGH (obj ≥ 20)</option><option value="NONLOCAL_LOW">Non-local LOW</option></select></label>

<label>Model<select id="model"><option value="cmp_FM">Final FM · cmp_FM</option></select></label><label>Mode<select id="mode"><option value="standard">Standard</option><option value="nonlocal">Non-local ≥ 2 km</option></select></label>

<div class="layer-group"><label><input type="checkbox" data-layer="B" checked>Buildings</label><label><input type="checkbox" data-layer="R" checked>Roads</label><label><input type="checkbox" data-layer="P" checked>POIs</label><label><input type="checkbox" data-layer="LC" checked>LC</label><label><input type="checkbox" data-layer="DEM" checked>DEM</label></div><button id="resetZoom">Reset zoom</button>
